html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}


/* L'écran de chargement d'AVA (27/10/2026) : les deux énergies (or de la Lumière à gauche, violet de l'Ombre à droite,
   comme l'écran de connexion), des particules qui montent, la flamme de l'Éther qui vacille, et la barre de chargement. */
#status {
	background: #0A0620;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	overflow: hidden;
	font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif;
}
#ava-fond-lumiere, #ava-fond-ombre {
	position: absolute; top: 0; bottom: 0; left: 0; right: 0;
}
#ava-fond-ombre {
	background: radial-gradient(ellipse 60% 45% at 72% 42%, rgba(154, 92, 255, 0.32), transparent 70%),
		linear-gradient(#3A1680, #1E0C4E 50%, #0A0620);
}
#ava-fond-lumiere {
	background: radial-gradient(ellipse 60% 45% at 28% 42%, rgba(255, 201, 74, 0.30), transparent 70%),
		linear-gradient(#A8741C, #6E440E 50%, #301A08);
	-webkit-mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%);
	mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 55%);
}
#ava-frontiere {
	position: absolute; top: 0; bottom: 0; left: 50%; width: 70px; margin-left: -35px;
	background: linear-gradient(90deg, transparent, rgba(255, 245, 255, 0.07) 40%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 245, 255, 0.07) 60%, transparent);
}
.ava-particule {
	position: absolute; bottom: -10px; border-radius: 50%;
	animation-name: ava-monte; animation-timing-function: linear; animation-iteration-count: infinite;
}
@keyframes ava-monte {
	0% { transform: translateY(0); opacity: 0; }
	15% { opacity: 1; }
	85% { opacity: 1; }
	100% { transform: translateY(-105vh); opacity: 0; }
}
/* Le logo à la place exacte de celui du jeu (écran de connexion, déjà connecté) : un cadre de 294 × 360 points du jeu,
   au milieu de l'écran ; la taille d'un point (--s) est calculée comme dans le jeu (720 × 1280, « expand »). La barre
   est là où seront les lettres A V A : quand le jeu démarre, la flamme ne bouge pas et la barre devient « AVA ». */
#ava-logo {
	position: absolute; left: 50%; top: 50%;
	width: calc(294px * var(--s, 0.54)); height: calc(360px * var(--s, 0.54));
	margin-left: calc(-147px * var(--s, 0.54)); margin-top: calc(-180px * var(--s, 0.54));
}
#ava-logo > svg {
	position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 32%;
	animation: ava-vacille 2.4s ease-in-out infinite;
}
@keyframes ava-vacille {
	0%, 100% { transform: scale(1, 1); }
	50% { transform: scale(1.012, 0.99); }
}
.ava-etincelle {
	position: absolute; width: 5px; height: 5px; border-radius: 50%; top: 40%;
	animation: ava-etincelle 1.8s ease-out infinite;
}
@keyframes ava-etincelle {
	0% { transform: translate(0, 0) scale(1); opacity: 0; }
	20% { opacity: 1; }
	100% { transform: translate(var(--dx), -80px) scale(0.3); opacity: 0; }
}
#status-progress {
	position: absolute; left: 21%; width: 58%; top: 81%; height: 13px; margin-top: -6px; border-radius: 10px;
	background: rgba(10, 8, 32, 0.8); border: 1.5px solid rgba(233, 221, 255, 0.55);
	box-shadow: 0 0 16px rgba(180, 140, 255, 0.25); overflow: hidden; display: none;
}
#ava-plein {
	position: absolute; left: 0; top: 0; bottom: 0; width: 6%; border-radius: 10px;
	background: linear-gradient(90deg, #FFD24A, #FFF3C4 50%, #B57BFF);
	box-shadow: 0 0 12px rgba(255, 230, 180, 0.7); transition: width 0.25s ease-out;
}
#ava-plein::after {
	content: ''; position: absolute; top: 0; bottom: 0; width: 40px; left: -40px;
	background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
	animation: ava-reflet 1.4s linear infinite;
}
@keyframes ava-reflet { to { left: 110%; } }
#ava-texte {
	position: absolute; left: -40px; right: -40px; top: 100%; margin-top: 4px; text-align: center;
	color: #EADCFF; font-size: 14px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
}
#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 2;
}

		<script>
(function () {
	const zone = document.getElementById('ava-particules');
	for (let k = 0; k < 46; k++) {
		const p = document.createElement('span');
		const lumiere = k % 2 === 0;
		const taille = 2 + Math.random() * 4;
		p.className = 'ava-particule';
		p.style.left = (lumiere ? Math.random() * 48 : 52 + Math.random() * 48) + '%';
		p.style.width = p.style.height = taille + 'px';
		const clair = Math.random() < 0.35;
		const c = lumiere ? (clair ? '#FFF6D0' : '#FFD34D') : (clair ? '#E6D2FF' : '#B57BFF');
		p.style.background = c;
		p.style.boxShadow = '0 0 ' + (taille * 3) + 'px ' + c;
		p.style.animationDuration = (7 + Math.random() * 9) + 's';
		p.style.animationDelay = (-Math.random() * 14) + 's';
		zone.appendChild(p);
	}
	const logo = document.getElementById('ava-logo');
	const taille = () => document.documentElement.style.setProperty('--s', Math.min(window.innerWidth / 720, window.innerHeight / 1280));
	taille();
	window.addEventListener('resize', taille);
	const flamme = logo;
	for (let k = 0; k < 10; k++) {
		const e = document.createElement('span');
		const c = k % 2 === 0 ? '#FFE58A' : '#D9B8FF';
		e.className = 'ava-etincelle';
		e.style.left = (38 + Math.random() * 24) + '%';
		e.style.background = c;
		e.style.boxShadow = '0 0 8px ' + c;
		e.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
		e.style.animationDelay = (Math.random() * 1.8) + 's';
		e.style.animationDuration = (1.4 + Math.random() * 1.2) + 's';
		flamme.appendChild(e);
	}
}());
		</script>

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":32508860,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				// (un dernier avancement peut arriver après la disparition de l'écran de chargement)
				const plein = document.getElementById('ava-plein');
				const texte = document.getElementById('ava-texte');
				if (current > 0 && total > 0 && plein && texte) {
					const part = Math.min(100, Math.round(100 * current / total));
					plein.style.width = Math.max(6, part) + '%';
					texte.textContent = 'Chargement… ' + part + ' %';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
